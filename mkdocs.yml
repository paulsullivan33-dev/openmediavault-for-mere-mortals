site_name: OpenMediaVault for Mere Mortals
site_description: A plain language guide to OpenMediaVault, the Debian based home NAS system. Disks and filesystems, shared folders, users, SMB and NFS sharing, the apply step explained from the project's own code, plugins, backups, and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/openmediavault-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

